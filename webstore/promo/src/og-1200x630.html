<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="tile.css">
<style>
  .og { width: 1200px; height: 630px; display: flex; align-items: center; }
  .og .text { padding: 0 0 0 90px; width: 640px; flex: none; }
  .og .bus { width: 150px; margin-bottom: 30px; }
  .og h1 { font-size: 78px; margin-bottom: 18px; }
  .og p { font-size: 22px; max-width: 470px; }
  .og .shot { position: absolute; left: 700px; top: 90px; width: 820px; border-radius: 18px; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.25); }
  .og .url { position: absolute; left: 90px; bottom: 44px; font-size: 18px; font-weight: 500; opacity: .7; }
</style>
<body class="tile og">
  <div class="text">
    <img class="bus" src="bus.svg" alt="">
    <h1>Every class.<br>One board.</h1>
    <p>Your homework from every source, sorted, on your own computer.</p>
  </div>
  <div class="shot"><img src="../../screenshots/01-board-1280x800.png" alt=""></div>
  <div class="url">sillybusai.com</div>
</body>
