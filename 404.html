<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrong stop — Silly Bus AI</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/sillybusai-site/assets/img/icon-square.svg">
<link rel="stylesheet" href="/sillybusai-site/style.css">
<style>
  .lost { min-height: 80vh; display: grid; place-items: center; text-align: center; padding: 3rem 0; }
  .lost .hero-mark { margin: 0 auto 2rem; animation-name: drive-past; animation-duration: 2.2s; animation-fill-mode: forwards; }
  @keyframes drive-past { 0% { transform: translateX(-60vw); opacity: 0; } 35% { opacity: 1; } 55% { transform: translateX(0); } 70% { transform: translateX(0) rotate(0); } 100% { transform: translateX(0); opacity: 1; } }
  .lost h1 { font-size: clamp(2.4rem, 6vw, 4.4rem); }
  .lost p { color: var(--muted); margin: 1rem 0 2rem; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav"><a class="brand" href="/sillybusai-site/"><img src="/sillybusai-site/assets/img/logo.svg" alt="" width="46" height="32">Silly Bus AI</a></nav>
  <section class="lost">
    <div>
      <div class="hero-mark" style="width:200px"><img src="/sillybusai-site/assets/img/logo.svg" alt="" style="width:100%"></div>
      <h1>Wrong stop.</h1>
      <p>There's nothing at this address.</p>
      <a class="btn btn-primary" href="/sillybusai-site/">Back to the start <span class="arrow">→</span></a>
    </div>
  </section>
</div>
</body>
</html>
